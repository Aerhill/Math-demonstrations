<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grafičko rješavanje sustava jednadžbi</title>
<style>
:root{color-scheme:dark;--bg:#03060c;--panel:#09111c;--edge:#293d53;--muted:#a9b8c9;--teal:#1fffd2;--red:#ff4261}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f1f7ff;font-family:Inter,system-ui,sans-serif}main{width:min(1380px,calc(100% - 28px));margin:auto;padding:25px 0 35px}h1{margin:6px 0 3px;font-size:clamp(1.55rem,3vw,2.35rem)}header{margin-bottom:18px}.eyebrow{color:var(--teal);font-size:.78rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.subtitle,.note{color:var(--muted)}.layout{display:grid;grid-template-columns:315px minmax(0,1fr);gap:17px}.panel,.stage{background:var(--panel);border:1px solid var(--edge);border-radius:15px;box-shadow:0 18px 50px #0008}.panel{padding:18px}.panel h2{margin:0 0 6px;font-size:1.05rem}.note{font-size:.87rem;line-height:1.45;margin:0 0 16px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:13px}button,select,input{font:inherit}button{border:1px solid #416078;border-radius:8px;padding:9px 8px;color:#eaf6ff;background:#102031;cursor:pointer}button:hover{border-color:var(--teal);color:var(--teal)}.eq-card{border:1px solid #2b3d52;border-radius:10px;padding:12px;margin:10px 0;background:#0c1725}.eq-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}.eq-head strong{color:var(--teal);flex:1}select{min-width:102px;color:#eef7ff;background:#142335;border:1px solid #496078;border-radius:6px;padding:5px}.remove{padding:3px 8px;color:#ff9ba8;border-color:#643b46;background:transparent}.param{display:grid;grid-template-columns:43px 1fr 65px;align-items:center;gap:7px;margin:7px 0;color:#dce8f4;font-size:.86rem}.param input[type=range]{width:100%;accent-color:var(--teal)}.param input[type=number]{width:65px;padding:5px;color:#fff;background:#07101b;border:1px solid #40556b;border-radius:6px}.stage{padding:13px;min-width:0}.system-title{color:var(--muted);font-size:.86rem;margin:0 0 7px}.system{display:flex;align-items:stretch;margin:0 8px 13px;min-height:67px}.brace{width:27px;display:flex;align-items:center;justify-content:center;font-size:72px;line-height:.55;font-family:Georgia,serif;color:#f5fbff}.equations{flex:1;border-bottom:1px solid #e7f4ff;padding:7px 10px 8px;overflow-x:auto}.equation{white-space:nowrap;font-family:Georgia,serif;font-size:1.08rem;line-height:1.45}.equation em{color:#8eabbf;font-size:.8rem;font-family:monospace;font-style:normal;margin-left:9px}.solutions{padding:0 13px 11px;min-height:29px}.solutions b{color:var(--teal);margin-right:8px}.solution{color:var(--red);font-family:monospace;margin-right:13px}canvas{display:block;width:100%;height:min(65vh,610px);min-height:390px;background:#02050a;border:1px solid #26394b;border-radius:10px}.legend{display:flex;flex-wrap:wrap;gap:10px 15px;padding:10px 4px 0;color:var(--muted);font-size:.82rem}.legend span:before{content:'';display:inline-block;width:9px;height:9px;margin-right:5px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}@media(max-width:850px){.layout{grid-template-columns:1fr}.panel{order:2}.stage{order:1}canvas{height:58vh;min-height:350px}}
</style>
<style>
.eq-card{--eq-color:var(--teal);border-color:color-mix(in srgb,var(--eq-color),#293d53 55%)}
.eq-head strong{color:var(--eq-color)}
.param input[type=range]{accent-color:var(--eq-color)}
.system{min-height:122px}
.brace{width:48px;min-height:110px;font-size:128px;line-height:.42}
.equations{padding:18px 10px 19px}
.solutions{padding-top:5px}
.solution-line{display:block;color:var(--red);font-family:monospace;line-height:1.6}
.system{min-height:0}
.brace{min-height:0;font-size:92px;line-height:.38}
.equations{padding-top:12px;padding-bottom:12px}
</style></head>
<body><main><header><div class="eyebrow">Interaktivna matematika</div><h1>Grafičko rješavanje sustava jednadžbi</h1><p class="subtitle">Dodaj linearne i kvadratne jednadžbe, podesi koeficijente i promatraj zajednička rješenja.</p></header>
<section class="layout"><aside class="panel"><h2>Jednadžbe sustava</h2><p class="note">Svaka jednadžba ima vlastite klizače. Sustav može sadržavati proizvoljan broj jednadžbi.</p><div class="buttons"><button id="addLinear">＋ Linearna</button><button id="addQuadratic">＋ Kvadratna</button></div><div id="controls"></div></aside>
<section class="stage"><p class="system-title">Sustav jednadžbi</p><div class="system"><div id="equations" class="equations"></div></div><div id="solutions" class="solutions"><b>Rješenja:</b></div><canvas id="graph" aria-label="Graf sustava jednadžbi"></canvas><div id="legend" class="legend"></div></section></section></main>
<script>
(function(){
var canvas=document.getElementById('graph'),ctx=canvas.getContext('2d'),controls=document.getElementById('controls'),eqEl=document.getElementById('equations'),solEl=document.getElementById('solutions'),legend=document.getElementById('legend');
var colors=['#1fffd2','#ffbd4a','#a77bff','#64e572','#ff70c8','#55b8ff','#f77942','#d5f05a'],nextId=3;
var eqs=[{id:1,type:'linear',a:1,b:1},{id:2,type:'linear',a:-1,b:4}];
function fmt(n){return (Math.abs(n)<1e-8?0:n).toLocaleString('hr-HR',{maximumFractionDigits:2})}
function sign(n){return n<0?' − '+fmt(Math.abs(n)):' + '+fmt(n)}
function val(e,x){return e.type==='linear'?e.a*x+e.b:e.a*x*x+e.b*x+e.c}
function poly(e){return e.type==='linear'?[0,e.a,e.b]:[e.a,e.b,e.c]}
function text(e){return e.type==='linear'?'y = '+fmt(e.a)+'x'+sign(e.b):'y = '+fmt(e.a)+'x²'+sign(e.b)+'x'+sign(e.c)}
function card(e,idx){var p=e.type==='linear'?[['a',-5,5,.1],['b',-8,8,.1]]:[['a',-2,2,.1],['b',-6,6,.1],['c',-8,8,.1]],s='<div class="eq-card" style="--eq-color:'+colors[idx%colors.length]+'" data-id="'+e.id+'"><div class="eq-head"><strong>Jednadžba '+e.id+'</strong><select class="type"><option value="linear" '+(e.type==='linear'?'selected':'')+'>Linearna</option><option value="quadratic" '+(e.type==='quadratic'?'selected':'')+'>Kvadratna</option></select><button class="remove">×</button></div>';
p.forEach(function(q){var k=q[0];s+='<label class="param"><span>'+k+' =</span><input class="range" data-key="'+k+'" type="range" min="'+q[1]+'" max="'+q[2]+'" step="'+q[3]+'" value="'+e[k]+'"><input class="number" data-key="'+k+'" type="number" min="'+q[1]+'" max="'+q[2]+'" step="'+q[3]+'" value="'+e[k]+'"></label>'});return s+'</div>'}
function render(){controls.innerHTML=eqs.map(card).join('');controls.querySelectorAll('.eq-card').forEach(function(c){var e=eqs.find(function(x){return x.id===Number(c.dataset.id)});c.querySelector('.type').onchange=function(ev){e.type=ev.target.value;if(e.type==='quadratic'&&e.a===0)e.a=.5;render();draw()};c.querySelector('.remove').onclick=function(){if(eqs.length>1){eqs.splice(eqs.indexOf(e),1);render();draw()}};c.querySelectorAll('input').forEach(function(i){i.oninput=function(){var n=Number(i.value);if(!Number.isFinite(n))return;e[i.dataset.key]=n;c.querySelectorAll('[data-key="'+i.dataset.key+'"]').forEach(function(o){o.value=n});draw()}})})}
document.getElementById('addLinear').onclick=function(){eqs.push({id:nextId++,type:'linear',a:1,b:0});render();draw()};document.getElementById('addQuadratic').onclick=function(){eqs.push({id:nextId++,type:'quadratic',a:.5,b:0,c:0});render();draw()};
function roots(e1,e2){var p=poly(e1),q=poly(e2),A=p[0]-q[0],B=p[1]-q[1],C=p[2]-q[2],o=[],d;if(Math.abs(A)<1e-8){if(Math.abs(B)>1e-8)o.push(-C/B);return o}d=B*B-4*A*C;if(d<-1e-8)return o;if(Math.abs(d)<1e-8)o.push(-B/(2*A));else{o.push((-B-Math.sqrt(d))/(2*A));o.push((-B+Math.sqrt(d))/(2*A))}return o}
function solutions(){if(eqs.length<2)return[];var x=[],i,j;for(i=0;i<eqs.length;i++)for(j=i+1;j<eqs.length;j++)roots(eqs[i],eqs[j]).forEach(function(z){if(Number.isFinite(z)&&eqs.every(function(e){return Math.abs(val(e,z)-val(eqs[0],z))<.035}))x.push(z)});x.sort(function(a,b){return a-b});var u=[];x.forEach(function(z){if(!u.some(function(v){return Math.abs(v-z)<.025}))u.push(z)});return u.map(function(z){return{x:z,y:val(eqs[0],z)}})}
function ticks(span,pix){var r=span/Math.max(2,pix/80),p=Math.pow(10,Math.floor(Math.log10(r))),u=r/p;return(u<=1?1:u<=2?2:u<=5?5:10)*p}
function resize(){var r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);draw()}
function draw(){var w=canvas.clientWidth,h=canvas.clientHeight,p={l:51,r:20,t:18,b:39},xmin=-6,xmax=6,ymin=-8,ymax=8,sx=(w-p.l-p.r)/(xmax-xmin),sy=(h-p.t-p.b)/(ymax-ymin),px=function(x){return p.l+(x-xmin)*sx},py=function(y){return h-p.b-(y-ymin)*sy};
ctx.clearRect(0,0,w,h);ctx.fillStyle='#02050a';ctx.fillRect(0,0,w,h);ctx.font='12px monospace';ctx.lineWidth=1;ctx.strokeStyle='rgba(150,180,205,.18)';ctx.fillStyle='#dceafa';var xt=ticks(xmax-xmin,w),yt=ticks(ymax-ymin,h),x,y;
ctx.textAlign='center';ctx.textBaseline='top';for(x=Math.ceil(xmin/xt)*xt;x<=xmax+.001;x+=xt){ctx.beginPath();ctx.moveTo(px(x),p.t);ctx.lineTo(px(x),h-p.b);ctx.stroke();if(Math.abs(x)>1e-8)ctx.fillText(fmt(x),px(x),py(0)+7)}ctx.textAlign='right';ctx.textBaseline='middle';for(y=Math.ceil(ymin/yt)*yt;y<=ymax+.001;y+=yt){ctx.beginPath();ctx.moveTo(p.l,py(y));ctx.lineTo(w-p.r,py(y));ctx.stroke();if(Math.abs(y)>1e-8)ctx.fillText(fmt(y),px(0)-8,py(y))}ctx.strokeStyle='#f7fbff';ctx.lineWidth=1.35;ctx.beginPath();ctx.moveTo(p.l,py(0));ctx.lineTo(w-p.r+5,py(0));ctx.moveTo(px(0),h-p.b);ctx.lineTo(px(0),p.t-4);ctx.stroke();ctx.fillStyle='#fff';ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText('x',w-p.r+4,py(0)+8);ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText('y',px(0)-10,p.t-2);ctx.textAlign='right';ctx.textBaseline='top';ctx.fillText('0',px(0)-7,py(0)+7);
eqs.forEach(function(e,i){ctx.save();ctx.strokeStyle=colors[i%colors.length];ctx.shadowColor=colors[i%colors.length];ctx.shadowBlur=12;ctx.lineWidth=2.6;ctx.beginPath();for(var k=0;k<=w-p.l-p.r;k++){var xx=xmin+k/sx,yy=val(e,xx);if(k===0)ctx.moveTo(px(xx),py(yy));else ctx.lineTo(px(xx),py(yy))}ctx.stroke();ctx.restore()});
var ss=solutions();ss.forEach(function(s,si){if(s.x<xmin||s.x>xmax||s.y<ymin||s.y>ymax)return;var X=px(s.x),Y=py(s.y),lab='T'+('₀₁₂₃₄₅₆₇₈₉'[si+1])+' ('+fmt(s.x)+', '+fmt(s.y)+')';ctx.fillStyle='#ff4261';ctx.shadowColor='#ff4261';ctx.shadowBlur=14;ctx.beginPath();ctx.arc(X,Y,6,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.font='600 12px monospace';var tw=ctx.measureText(lab).width,lx=X+10,ly=Y-18;if(lx+tw>w-p.r)lx=X-tw-10;if(ly<p.t+4)ly=Y+10;if(ly+15>h-p.b)ly=Y-27;ctx.fillStyle='rgba(3,6,12,.92)';ctx.fillRect(lx-4,ly-2,tw+8,18);ctx.fillStyle='#ff4261';ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText(lab,lx,ly)});
eqEl.innerHTML=eqs.map(function(e,i){return'<div class="equation" style="color:'+colors[i%colors.length]+'">'+text(e)+'<em>(jednadžba '+(i+1)+')</em></div>'}).join('');solEl.innerHTML='<b>Rješenja:</b>'+(ss.length?ss.map(function(s,i){var sub=i+1,ord=i===0?'Prvo':i===1?'Drugo':(i+1)+'.';return'<span class="solution-line">'+ord+' rješenje u točki T<sub>'+sub+'</sub>(x<sub>'+sub+'</sub>,y<sub>'+sub+'</sub>), &nbsp;x<sub>'+sub+'</sub> = '+fmt(s.x)+', y<sub>'+sub+'</sub> = '+fmt(s.y)+'</span>'}).join(''):'<span>Nema zajedničkih rješenja za odabrane jednadžbe.</span>');legend.innerHTML=eqs.map(function(e,i){return'<span style="--c:'+colors[i%colors.length]+'">Jednadžba '+(i+1)+'</span>'}).join('')+'<span style="--c:#ff4261">zajedničko rješenje</span>'}
render();window.addEventListener('resize',resize);resize();
})();
</script></body></html>
